[package]
name = "reach"
version = "0.6.5"
description = "Cross-platform SSH & Remote Management Tool"
authors = ["Reach Contributors"]
edition = "2021"
license = "LicenseRef-Reach-SAL"

[lib]
name = "reach_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# SSH
russh = { version = "0.46", default-features = false }
russh-keys = { version = "0.46", default-features = false }
# Same version russh-keys already pulls in: used to read what a key says
# about itself (algorithm, fingerprint, whether it is encrypted) without
# needing the passphrase.
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption"] }
async-trait = "0.1"
ssh2-config = "0.7"

# Encryption
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
secrecy = { version = "0.10", features = ["serde"] }

# Vault storage
libsql = "0.6"
dirs = "5"
sha2 = "0.10"
# Keychain/credential storage
# NOTE: Not available on Android - needs tauri-plugin-biometric for Android Keystore
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# Toolchain detection & installation
which = "7"

# HTTP (AI API proxy)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# SOCKS5/SOCKS4 proxy (Tor, etc.)
tokio-socks = "0.5"

# MCP server. Axum rather than the official Rust MCP SDK: MCP is JSON-RPC 2.0
# over HTTP plus SSE — a small, stable spec — and this crate already pins deps
# deliberately for supply-chain reasons. Owning ~300 lines of protocol beats
# tracking a fast-moving SDK through breaking releases.
#
# Axum 0.6 is already in the tree transitively via Tauri; declared explicitly at
# 0.8 so the server does not silently change behaviour when Tauri bumps its own.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

# Regex (dependency graph)
regex = "1"

# Lua plugin engine
mlua = { version = "0.10", features = ["luau", "vendored", "async", "serialize", "send"] }
toml = "0.8"
# Plugin marketplace: download + extract release zips. Pinned >= 2.3 to avoid
# CVE-2025-29787 (symlink-based path traversal) which affects 1.3.0–2.2.x.
zip = "2.3"
flate2 = "1"
tar = "0.4"
tauri-plugin-process = "2.3.1"

# Remote desktop. IronRDP is pure Rust end to end — the connector, CredSSP,
# TLS via rustls, the codecs — so it builds on all four targets, Android
# included, with no C toolchain in the loop. `default-features = false` keeps
# sound and drive redirection out: each pulls a native backend and neither is
# needed to see a desktop and drive it. The clipboard is in, with a backend of
# our own (src/rdp/clipboard.rs) rather than IronRDP's Windows-only one.
#
# Pinned to a commit rather than taken from crates.io. The published
# ironrdp-client 0.1.0 delivers only whole framebuffers; the repository since
# then delivers tightly packed changed regions (`DesktopUpdate`), which is the
# difference between a cursor blink costing a few hundred bytes and costing
# eight megabytes. All three crates come from the same revision so their types
# agree. Move back to versions when the next release carries this.
ironrdp-client = { git = "https://github.com/Devolutions/IronRDP", rev = "9b151c4c2e47c6014e1e8e55909d4180aa8bdb99", default-features = false, features = ["rustls", "clipboard"] }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "9b151c4c2e47c6014e1e8e55909d4180aa8bdb99" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "9b151c4c2e47c6014e1e8e55909d4180aa8bdb99" }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "9b151c4c2e47c6014e1e8e55909d4180aa8bdb99" }
smallvec = "1"

# PTY, Serial, Autostart, Updater, native drag-out (desktop only)
[target.'cfg(not(target_os = "android"))'.dependencies]
# The local clipboard for RDP: text and file lists. Android has no file clipboard and uses the plugin.
arboard = { version = "3.6", default-features = false }
portable-pty = "0.8"
serialport = "4"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# Dragging a file out of the window to the desktop. Tauri has no API for this
# and there is no other maintained option; see src/lib/explorer/drag-out.ts
# for what it can and cannot do.
tauri-plugin-drag = "2"

# libgit2-sys links OpenSSL on Linux. It reaches us through ssh2-config's
# build-dependency on git2, so the feature has to be unified in *both* the
# normal and build-dependency graphs — hence the two entries. `vendored` builds
# OpenSSL from source because the CI image installs no libssl-dev.
#
# Scoped to Linux deliberately. Windows does not need OpenSSL at all here, and
# declaring it unconditionally broke every Windows build: the vendored build
# shells out to perl, and Git Bash's MSYS perl lacks Locale::Maketext::Simple,
# so `cargo build` failed before compiling a single line of this crate.
# macOS uses SecureTransport rather than OpenSSL.
#
# `target_os = "linux"`, NOT `all(unix, not(target_os = "macos"))`. Android is
# also unix and also not macOS, so that expression caught it and forced the
# vendored build on the NDK, where it cannot work: openssl-src calls the
# prefixed binutils, and NDK r23+ ships only `llvm-ranlib`, so every Android
# release build died with
#     /bin/sh: 1: aarch64-linux-android-ranlib: not found
#     make: *** [Makefile:2807: install_dev] Error 127
# Android's target_os is "android", so naming Linux explicitly excludes it.
# Dragging a remote file out without downloading it first. Explorer pulls the
# bytes through an IStream on drop, so nothing is fetched while dragging.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] macro expands to paths rooted at this crate, so it has to
# be a direct dependency even though everything else comes through `windows`.
windows-core = "0.61"
# Reaching the WebView2 controller to tell it focus moved (issue #49).
webview2-com = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# macOS only, and only to turn one user default off at launch: holding a key in
# a WKWebView opens the accent picker instead of repeating the key, so a held
# arrow or backspace does nothing at all in the terminal. Setting it needs an
# Objective-C message, and `Info.plist` is not an answer — it is not a
# NSUserDefaults domain, so a key placed there is simply never read. See
# `disable_press_and_hold` in lib.rs. objc2 is already in the tree under
# tao/wry, so naming it here downloads nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.build-dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# The app itself stays a debug build for fast incremental compiles, but its
# dependencies are optimised even in dev: RDP bitmap decoding, TLS and the
# image codecs run tens of times slower unoptimised, which made a remote
# desktop in `tauri dev` lag in ways a release build never would.
[profile.dev.package."*"]
opt-level = 3
