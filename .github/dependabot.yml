version: 2
updates:
  # The app's Rust side
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # The app's frontend
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # SvelteKit and svelte-check support TypeScript up to 6; 7 works in
      # svelte-check only behind an experimental flag. Lift this once
      # SvelteKit lists 7 in its peer dependencies.
      - dependency-name: "typescript"
        versions: [">=7"]
      # SvelteKit 3 and adapter-static 4 only install together and move
      # every $lib import to #lib; that migration is done as its own
      # release, not as two bot PRs that each fail without the other.
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-static"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # The docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
    groups:
      docs:
        patterns: ["*"]

  # Workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
