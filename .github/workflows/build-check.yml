name: Build check

# Builds and tests on every desktop platform without releasing anything, so a
# change (a dependency update above all) is known to build on macOS and Linux
# before it is merged, not when a release tag is pushed.
on:
  pull_request:
    branches: [main]
  # Also on main itself: a pull request can only restore build caches saved
  # on its own branch or on main, so this is what lets a new one start warm.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No debug info in CI builds: nobody attaches a debugger here, and it is
  # most of the size of target/. Smaller targets link faster and keep the
  # caches inside GitHub's 10 GB, where they are not evicted.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev libasound2-dev

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Only main saves. A pull request restores main's cache anyway, and
          # one saving its own pushed main's out of the 10 GB GitHub keeps:
          # the next run then built everything cold, 18 minutes for Android.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check and build the frontend
        run: |
          npm run check
          npm run i18n:check
          npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # Each platform compiles its own code (Windows Hello, Touch ID, USB
      # security keys), so each one is linted: no warning gets merged.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      # The runner is Apple silicon; Intel Macs get their own release build.
      - name: Build for Intel Macs
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo build --lib --target x86_64-apple-darwin

  # The Rust tests on a real Android system image. They cannot run on the
  # desktop runners: Android has its own C library, and system libraries such
  # as zlib that the app links against come from the device.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Only main saves. A pull request restores main's cache anyway, and
          # one saving its own pushed main's out of the 10 GB GitHub keeps:
          # the next run then built everything cold, 18 minutes for Android.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # tauri-build wants the built frontend to exist.
      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Build the test binary for Android
        working-directory: src-tauri
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$BIN/x86_64-linux-android24-clang"
          export CXX_x86_64_linux_android="$BIN/x86_64-linux-android24-clang++"
          export AR_x86_64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$BIN/x86_64-linux-android24-clang"
          TEST_BIN=$(cargo test --lib --no-run --target x86_64-linux-android --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' | tail -1)
          mkdir -p "$RUNNER_TEMP/android-test"
          cp "$TEST_BIN" "$RUNNER_TEMP/android-test/reach-tests"
          cp "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$RUNNER_TEMP/android-test/"
          # The known_hosts tests compare with OpenSSH's output, kept next to them.
          cp -r src/ssh/knownhosts/testdata "$RUNNER_TEMP/android-test/testdata"

      - name: Run the tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb push "$RUNNER_TEMP/android-test/." /data/local/tmp/reach/
            adb shell "cd /data/local/tmp/reach && chmod +x reach-tests && REACH_KNOWNHOSTS_TESTDATA=/data/local/tmp/reach/testdata HOME=/data/local/tmp/reach TMPDIR=/data/local/tmp/reach LD_LIBRARY_PATH=/data/local/tmp/reach ./reach-tests"

  # The documentation site, built the way its deploy builds it: from docs/
  # alone, with the app never set up.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the site
        run: |
          npm ci
          npm run build

  # The APKs, packaged the way the release packages them: the same generated
  # Gradle project, the same signing and packaging block, the same build
  # command. Signed with a throwaway key made here, since only the release has
  # the real one. The test job above builds the Rust side only.
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Only main saves. A pull request restores main's cache anyway, and
          # one saving its own pushed main's out of the 10 GB GitHub keeps:
          # the next run then built everything cold, 18 minutes for Android.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          npx tauri android init
          # init generates the project with Tauri's placeholder icon; Reach's
          # launcher icons (adaptive included) replace it.
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          # Its activity also makes room for the phone keyboard (#127).
          cp src-tauri/android/MainActivity.kt src-tauri/gen/android/app/src/main/java/com/reach/desktop/MainActivity.kt

      - name: Make a throwaway signing key
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/check.keystore" -alias reach -keyalg RSA -keysize 2048 -validity 1 -storepass checkcheck -keypass checkcheck -dname "CN=Build check"

      - name: Configure signing and packaging in Gradle
        run: |
          cat >> src-tauri/gen/android/app/build.gradle.kts << 'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "reach"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          GRADLE

      - name: Build Android APKs
        # The NDK path comes from the runner image, so it is read in the shell:
        # ${{ env.X }} sees only variables the workflow sets itself, and was
        # empty. The newest installed NDK, the one tauri android init uses.
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/check.keystore
          ANDROID_KEYSTORE_PASSWORD: checkcheck

      - name: The APKs are there and signed
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk
          find $OUT -name '*release*.apk' | tee /tmp/apks
          [ "$(wc -l < /tmp/apks)" -eq 2 ]
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)
          while read apk; do ${BUILD_TOOLS}apksigner verify "$apk"; done < /tmp/apks
