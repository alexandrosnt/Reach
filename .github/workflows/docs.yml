name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

  # Download links are resolved into the HTML while the site builds, so a new
  # release has to rebuild the site or the buttons keep offering the old one.
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The newest 22, not the runner's cached one: Astro raises its
          # minimum within 22 (7.4.2 needs 22.23.4) and the cache lags.
          check-latest: true

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs
        env:
          # The canonical home. Everything absolute in the output — sitemap,
          # robots, llms.txt, canonical and og: tags — is built from these.
          SITE_URL: https://reachssh.com
          BASE_PATH: /
          # Lifts the anonymous API allowance, so the release lookup that bakes
          # the download links in is never rate limited on a shared runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the offline fallback in step with what was just published, so a
      # later docs-only build still emits the current links.
      - name: Refresh the committed release snapshot
        run: node scripts/snapshot-release.mjs
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # dnf reads its repository from the site: the signed repodata the
      # release made, unpacked under /rpm. A release without it (before
      # 0.7.4) leaves the site as it was.
      - name: Add the dnf repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern rpm-repodata.tar.gz --pattern reach-packages.asc --dir repo-dl 2>/dev/null; then
            mkdir -p docs/dist/rpm
            tar -xzf repo-dl/rpm-repodata.tar.gz -C docs/dist/rpm
            cp repo-dl/reach-packages.asc docs/dist/reach-packages.asc
          else
            echo "The latest release has no dnf repository yet."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # A sitemap waits to be crawled; IndexNow asks. Bing, Yandex, Seznam and
  # Naver fetch within minutes rather than days, and Bing's index is what
  # ChatGPT's search reads. Runs after deploy because it reads the live
  # sitemap, so it can only ever submit pages that are already serving.
  notify-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs
        working-directory: docs
        env:
          SITE_URL: https://reachssh.com
        # Never fail a deploy over a notification: the pages are live either
        # way and the sitemap still does its job.
        continue-on-error: true
