name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

  # Download links are resolved into the HTML while the site builds, so a new
  # release has to rebuild the site or the buttons keep offering the old one.
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs
        env:
          # The canonical home. Everything absolute in the output — sitemap,
          # robots, llms.txt, canonical and og: tags — is built from these.
          SITE_URL: https://reachssh.com
          BASE_PATH: /
          # Lifts the anonymous API allowance, so the release lookup that bakes
          # the download links in is never rate limited on a shared runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the offline fallback in step with what was just published, so a
      # later docs-only build still emits the current links.
      - name: Refresh the committed release snapshot
        run: node scripts/snapshot-release.mjs
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
