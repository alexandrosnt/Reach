name: Windows signing (SignPath)

# The Windows build, signed through SignPath Foundation, outside any release.
#
# SignPath signs only files a GitHub workflow uploaded as an artifact, so it can
# vouch that they were built here from this repository (origin verification).
# tauri-action builds, bundles and uploads in one step and leaves no point to
# sign in between, so the Windows build is done in stages:
#
#   1. build reach.exe without bundling
#   2. make one copy of reach.exe per installer, each marked with its bundle
#      type the way the Tauri bundler would (see below)
#   3. SignPath signs both copies
#   4. bundle the MSI and NSIS installers, each around its own signed copy,
#      with the bundler's own patching turned off
#   5. SignPath signs both installers
#   6. sign them for the in-app updater again, since the signatures made while
#      bundling covered the unsigned files (createUpdaterArtifacts is
#      v1Compatible, so the .zip of each installer is remade and signed too)
#   7. check every signature, including reach.exe inside each installer
#
# Why two copies: while bundling, Tauri overwrites the placeholder
# __TAURI_BUNDLE_TYPE_VAR_UNK in the main binary with _MSI or _NSS, so the
# updater knows which installer to fetch (tauri-bundler, patch_binary). Done
# after signing, that broke the signature: the first test run's MSI held a
# reach.exe whose signature read HashMismatch. The same bytes are written here
# before signing, and --no-binary-patching keeps the bundler from writing them
# again.
#
# Run by hand while this is being set up: it signs with the policy chosen below
# (test-signing uses SignPath's self-signed test certificate) and keeps the
# result as a workflow artifact. Nothing is attached to a release.

on:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: SignPath signing policy
        type: choice
        options: [test-signing, release-signing]
        default: test-signing

permissions:
  contents: read
  actions: read

env:
  SIGNPATH_ORGANIZATION_ID: 5ca94c61-2212-4202-a232-7fe70630293f
  SIGNPATH_PROJECT: Reach

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # The same fixed Rust as the release and the checks.
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build reach.exe
        run: npx tauri build --no-bundle

      # The same edit tauri-bundler's patch_binary makes: the placeholder,
      # found exactly once, overwritten in place with a token of equal length.
      - name: Make one reach.exe per installer
        shell: node {0}
        run: |
          const fs = require('fs');
          const exe = fs.readFileSync('src-tauri/target/release/reach.exe');
          const token = Buffer.from('__TAURI_BUNDLE_TYPE_VAR_UNK');
          const at = exe.indexOf(token);
          if (at < 0 || exe.indexOf(token, at + 1) >= 0) throw new Error('expected the bundle type placeholder exactly once in reach.exe');
          for (const [dir, tag] of [['msi', 'MSI'], ['nsis', 'NSS']]) {
            const copy = Buffer.from(exe);
            Buffer.from(`__TAURI_BUNDLE_TYPE_VAR_${tag}`).copy(copy, at);
            fs.mkdirSync(`unsigned-app/${dir}`, { recursive: true });
            fs.writeFileSync(`unsigned-app/${dir}/reach.exe`, copy);
            console.log(`unsigned-app/${dir}/reach.exe marked ${tag} at ${at}`);
          }

      - name: Upload both copies for signing
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: unsigned-app/
          if-no-files-found: error

      - name: Sign reach.exe
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: reach-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Every signing request is approved by hand.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      # Each installer around its own signed copy. The bundler must not touch
      # the binary again, or the signature breaks.
      - name: Bundle the installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          foreach ($kind in 'msi', 'nsis') {
            $sig = Get-AuthenticodeSignature "signed-app/$kind/reach.exe"
            if (-not $sig.SignerCertificate -or $sig.Status -eq 'HashMismatch') { throw "signed-app/$kind/reach.exe is not signed ($($sig.Status))" }
            Write-Host "$kind reach.exe signed by: $($sig.SignerCertificate.Subject)"
            Copy-Item "signed-app/$kind/reach.exe" src-tauri/target/release/reach.exe -Force
            npx tauri bundle --bundles $kind --no-binary-patching
            if ($LASTEXITCODE -ne 0) { throw "bundling $kind failed" }
          }

      - name: Gather the installers
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory unsigned-installers | Out-Null
          Copy-Item "src-tauri/target/release/bundle/msi/Reach_${v}_x64_en-US.msi" unsigned-installers/
          Copy-Item "src-tauri/target/release/bundle/nsis/Reach_${v}_x64-setup.exe" unsigned-installers/

      - name: Upload the installers for signing
        id: unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: unsigned-installers/
          if-no-files-found: error

      - name: Sign the installers
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: reach-installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      # The updater checks a minisign signature over the exact bytes it
      # downloads. The ones made while bundling cover the unsigned installers,
      # so each file that ships is signed again here, after SignPath.
      - name: Sign for the in-app updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $out = New-Item -ItemType Directory release-files
          foreach ($name in "Reach_${v}_x64_en-US.msi", "Reach_${v}_x64-setup.exe") {
            $file = "signed-installers/$name"
            $sig = Get-AuthenticodeSignature $file
            if (-not $sig.SignerCertificate) { throw "$name carries no signature" }
            Write-Host "$name signed by: $($sig.SignerCertificate.Subject)"
            Copy-Item $file $out
          }
          # The v1-compatible updater bundles: each installer alone in a zip.
          Compress-Archive -Path "$out/Reach_${v}_x64_en-US.msi" -DestinationPath "$out/Reach_${v}_x64_en-US.msi.zip"
          Compress-Archive -Path "$out/Reach_${v}_x64-setup.exe" -DestinationPath "$out/Reach_${v}_x64-setup.nsis.zip"
          foreach ($f in Get-ChildItem $out -File) {
            # Bound to the version, as tauri build does for the files it signs.
            npx tauri signer sign --app-version $v $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "could not sign $($f.Name) for the updater" }
          }
          Get-ChildItem $out | Format-Table Name, Length

      # Every signature, including reach.exe inside each installer, the one
      # that broke when the bundler patched it after signing. The test
      # certificate's root is not trusted on Windows, so for test-signing a
      # signature is accepted when intact; for release-signing it must be Valid.
      - name: Check every signature
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $release = '${{ inputs.signing-policy }}' -eq 'release-signing'
          function Check($path, $what) {
            $s = Get-AuthenticodeSignature $path
            $ok = $s.SignerCertificate -and ($s.Status -eq 'Valid' -or (-not $release -and $s.Status -eq 'UnknownError'))
            Write-Host "$what : $($s.Status) | $($s.SignerCertificate.Subject)"
            if (-not $ok) { throw "$what is not properly signed ($($s.Status))" }
          }
          function CheckMark($path, $tag, $what) {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($path))
            if (-not $text.Contains("__TAURI_BUNDLE_TYPE_VAR_$tag")) { throw "$what is not marked $tag for the updater" }
          }
          Check "release-files/Reach_${v}_x64_en-US.msi" 'MSI'
          Check "release-files/Reach_${v}_x64-setup.exe" 'setup.exe'

          $msi = New-Item -ItemType Directory check-msi
          $p = Start-Process msiexec -ArgumentList "/a `"$PWD\release-files\Reach_${v}_x64_en-US.msi`" /qn TARGETDIR=`"$($msi.FullName)`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "could not unpack the MSI ($($p.ExitCode))" }
          $inner = Get-ChildItem $msi -Recurse -Filter reach.exe | Select-Object -First 1
          if (-not $inner) { throw "no reach.exe in the MSI" }
          Check $inner.FullName 'reach.exe in the MSI'
          CheckMark $inner.FullName 'MSI' 'reach.exe in the MSI'

          7z x "release-files/Reach_${v}_x64-setup.exe" -ocheck-nsis -y | Out-Null
          $inner = Get-ChildItem check-nsis -Recurse -Filter reach.exe | Select-Object -First 1
          if (-not $inner) { throw "no reach.exe in setup.exe" }
          Check $inner.FullName 'reach.exe in setup.exe'
          CheckMark $inner.FullName 'NSS' 'reach.exe in setup.exe'

      - name: Keep the signed files
        uses: actions/upload-artifact@v7
        with:
          name: reach-windows-signed-${{ steps.version.outputs.version }}
          path: release-files/
          if-no-files-found: error
