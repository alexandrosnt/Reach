name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # To ask the docs workflow to run once the release is out; see publish-release.
  actions: write

jobs:
  # The one release every build uploads into. When each build made the
  # release itself, two finishing at the same moment each found none and made
  # one: in 0.7.1 the Windows files and their updater entries went into a
  # second draft that was never published, so Windows was never offered the
  # update. Created once here, before any build starts, it cannot be doubled.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-run finds the draft its first run made.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Reach $GITHUB_REF_NAME" \
              -F body=@.github/release-notes.md \
              -F draft=true \
              --jq .id)
          fi
          echo "Release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev rpm

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # A cache saved under a tag can only be restored by that same tag,
          # so it is never used again; saving it only evicts main's caches.
          save-if: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # macOS 15 only offers the Local Network prompt to builds signed with an
      # Apple-issued certificate (issue #47). When the secrets are present the
      # build is signed and notarized.
      #
      # When they are not, the bundle is still ad-hoc signed. Without this the
      # only signature on a release is the one the linker puts on the
      # executable, which leaves the bundle itself unsealed -- `codesign
      # --verify --deep --strict` reports "code has no resources but signature
      # indicates they must be present", and `Sealed Resources=none`. macOS
      # identifies an app for the Local Network grant by its code signature, so
      # a bundle with no seal has nothing stable to be granted, which is why
      # re-signing by hand was what restored access on the reporter's machine.
      # Tauri reads "-" as the ad-hoc identity and signs the whole bundle,
      # nested code included, before it builds the DMG. This is not a
      # substitute for Developer ID and notarization: Gatekeeper still blocks a
      # downloaded copy, and the signature changes with every build, so the
      # grant is not guaranteed to survive an update.
      #
      # The variables are exported from the shell rather than set on the job,
      # because an empty APPLE_SIGNING_IDENTITY would be taken as an identity
      # and make codesign fail with "no identity found".
      - name: Enable macOS signing when credentials are present
        if: matrix.platform == 'macos-latest'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$IDENTITY" ]; then
            echo "No Apple signing identity configured; falling back to ad-hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$APPLE_ID_"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "macOS signing enabled."

      # The release description, and the notes the in-app updater shows (they
      # reach latest.json from releaseBody). The dialog prints them as plain
      # text, so the file is kept short and free of markup.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat .github/release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
          # AppImage update information (AppImageSpec, gh-releases-zsync):
          # linuxdeploy's AppImage plugin embeds it and writes the .zsync file,
          # so AppImageUpdate, AppImageLauncher and Gear Lever can update Reach
          # as well as its own updater. Read only by the Linux build.
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|alexandrosnt|Reach|latest|Reach_*_amd64.AppImage.zsync
        with:
          # Into the release made above, never a new one.
          releaseId: ${{ needs.create-release.outputs.id }}
          # Still read for the in-app updater's notes in latest.json.
          releaseBody: ${{ steps.notes.outputs.body }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # The .zsync that the update information above points to belongs next to
      # the AppImage in the release; tauri-action uploads only the bundles.
      # appimagetool writes it into its working directory, which under the
      # Tauri CLI is src-tauri/, not the bundle folder (seen in a local build).
      # It must describe the very AppImage being shipped, so its name and
      # SHA-1 are checked against that file before anything is uploaded.
      - name: Upload the AppImage .zsync
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          set -euo pipefail
          found=0
          for f in src-tauri/*.AppImage.zsync; do
            [ -f "$f" ] || continue
            found=1
            img="src-tauri/target/release/bundle/appimage/$(basename "$f" .zsync)"
            [ -f "$img" ] || { echo "::error::$f has no matching AppImage at $img"; exit 1; }
            grep -aqx "Filename: $(basename "$img")" "$f" || { echo "::error::$f names another file"; exit 1; }
            grep -aqx "SHA-1: $(sha1sum "$img" | cut -d' ' -f1)" "$f" || { echo "::error::$f does not match $img"; exit 1; }
            url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")"
            gh api --method POST -H "Content-Type: application/octet-stream" "$url" --input "$f" --jq .name
          done
          [ "$found" -eq 1 ] || { echo "::error::No .zsync was made: the AppImage has no update information."; exit 1; }

      # A bundle that ships without a sealed signature is the defect from
      # issue #47, and it is invisible until someone runs codesign on an
      # installed copy. Fail the build here instead.
      - name: Verify the macOS bundle signature
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          found=0
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            [ -d "$app" ] || continue
            found=1
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=4 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | tee /tmp/sig.txt
            echo "::endgroup::"
            if grep -q "Sealed Resources=none" /tmp/sig.txt; then
              echo "::error::$app has no sealed resources; the bundle was not signed."
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app bundle found to verify."
            exit 1
          fi
          echo "Bundle signature verified."

  publish-release:
    # Android too: the docs site is rebuilt from the published release, and a
    # release published before its APKs arrive gives the site a download page
    # with no Android link until the next release.
    needs: [create-release, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      # The last look before users see it: every platform the updater serves
      # must be in latest.json with a signature. Anything missing stops the
      # release here, as a draft, instead of leaving those users without the
      # update and nobody knowing.
      - name: Check the updater manifest lists every platform
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          set -euo pipefail
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::latest.json is missing from the release."; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          missing=0
          for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            sig=$(jq -r --arg p "$platform" '.platforms[$p].signature // empty' latest.json)
            if [ -z "$sig" ]; then
              echo "::error::latest.json has no signed entry for $platform."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          apks=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '[.[] | select(.name | endswith(".apk"))] | length')
          [ "$apks" -ge 2 ] || { echo "::error::The Android APKs are missing from the release."; exit 1; }
          echo "Every platform is in latest.json, and the APKs are attached."

      # apt install reach / dnf install reach. The indexes are signed with
      # the repository key (secrets APT_GPG_PRIVATE_KEY, APT_GPG_PASSPHRASE)
      # and nothing is published without them: a missing key stops the
      # release here, as a draft. APT's flat index goes into the release
      # beside the .deb; dnf's repodata cannot (asset names have no
      # folders), so it travels as one archive the docs site unpacks.
      - uses: actions/checkout@v7
      - name: Sign the apt and dnf repositories
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
          REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c
          mkdir -p pkgs
          for kind in deb rpm; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq "[.[] | select(.name | endswith(\".$kind\"))][0].id")
            name=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq "[.[] | select(.name | endswith(\".$kind\"))][0].name")
            [ -n "$id" ] || { echo "::error::No .$kind in the release"; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "pkgs/$name"
          done
          bash scripts/package-repos.sh pkgs repo "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          tar -C repo/rpm -czf rpm-repodata.tar.gz repodata
          for f in repo/apt/InRelease repo/apt/Release repo/apt/Release.gpg repo/apt/Packages repo/apt/Packages.gz repo/reach-packages.asc rpm-repodata.tar.gz; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")" \
              --input "$f" --jq .name
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false

      # The docs site bakes the download links in at build time, so it has to
      # rebuild after each release. It listens for "release published", but a
      # release made with the workflow's own token never raises that event for
      # other workflows: GitHub's rule against workflows triggering each other.
      # workflow_dispatch is the one event that rule exempts, so ask directly.
      - name: Rebuild the docs site with the new download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          # Phones only: x86 builds serve emulators, and each target added a
          # full copy of the app to the APK and to the build time.
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # A cache saved under a tag can only be restored by that same tag,
          # so it is never used again; saving it only evicts main's caches.
          save-if: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          npx tauri android init
          # init generates the project with Tauri's placeholder icon; Reach's
          # launcher icons (adaptive included) replace it.
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # One permanent key, kept as a repository secret. Android installs an
      # update only over an app signed with the same key, so a key made fresh
      # for each build meant every update failed until the old app was removed.
      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore

      - name: Configure signing and packaging in Gradle
        run: |
          cat >> src-tauri/gen/android/app/build.gradle.kts << 'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "reach"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              // Compress the native library inside the APK. Android's default
              // stores it as-is so it can be mapped in place, which made the
              // download as large as the library itself.
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          GRADLE

      - name: Build Android APKs
        # The NDK path comes from the runner image, so it is read in the shell:
        # ${{ env.X }} sees only variables the workflow sets itself, and was
        # empty. The newest installed NDK, the one tauri android init uses.
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Name the APKs after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p dist-android
          cp "$(find $OUT -path '*arm64*' -name '*release*.apk' | head -1)" "dist-android/Reach_${VERSION}_android_arm64.apk"
          cp "$(find $OUT -path '*arm*' ! -path '*arm64*' -name '*release*.apk' | head -1)" "dist-android/Reach_${VERSION}_android_armv7.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)
          for apk in dist-android/*.apk; do ${BUILD_TOOLS}apksigner verify "$apk"; done
          ls -la dist-android

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-android/*.apk
